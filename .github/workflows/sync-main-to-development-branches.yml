name: Propose main updates to development branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ./.github/workflows/sync-development-branches.yml
    with:
      base_branch: main
      branch_prefixes: agent/,claude/,codex/,dev/,feature/,fix/
    secrets: inherit
