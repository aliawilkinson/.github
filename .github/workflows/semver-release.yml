name: SemVer release

on:
  workflow_call:
    inputs:
      target_branch:
        description: Trunk branch that receives release pull requests
        required: false
        type: string
        default: main
      config_file:
        description: Release Please configuration path in the caller repository
        required: false
        type: string
        default: release-please-config.json
      manifest_file:
        description: Release Please version manifest path in the caller repository
        required: false
        type: string
        default: .release-please-manifest.json
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: Optional token whose PRs and tags should trigger other workflows
        required: false
    outputs:
      release_created:
        description: Whether this run created a release
        value: ${{ jobs.release.outputs.release_created }}
      tag_name:
        description: Created immutable SemVer tag
        value: ${{ jobs.release.outputs.tag_name }}
      version:
        description: Created SemVer version without the v prefix
        value: ${{ jobs.release.outputs.version }}
      sha:
        description: Commit SHA referenced by the release tag
        value: ${{ jobs.release.outputs.sha }}
      release_url:
        description: Created GitHub Release URL
        value: ${{ jobs.release.outputs.release_url }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      release_url: ${{ steps.release.outputs.html_url }}
    steps:
      - name: Maintain release PR or create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ inputs.target_branch }}
          config-file: ${{ inputs.config_file }}
          manifest-file: ${{ inputs.manifest_file }}
